[package]
name = "trimwire"
version = "0.3.13"
edition = "2024"
rust-version = "1.85"
authors = ["Andre Zagatti <andre.zagatti1@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A small local gateway that prunes Claude Code's conversation context on every API call. Anthropic-sanctioned, no CA cert, no restart."
homepage = "https://trimwire.dev"
repository = "https://github.com/AZagatti/trimwire"
readme = "README.md"
keywords = ["claude", "claude-code", "anthropic", "context", "proxy"]
categories = ["command-line-utilities", "web-programming::http-server", "development-tools"]
# Only ship what a `cargo install` consumer needs — keeps the published .crate
# small (excludes pocs/, benchmark/, tests/fixtures/, dev docs, .github/, etc.).
# Files `include_str!`'d from src/ must ship or the packaged crate won't compile:
# the quality_corpus JSONs (src/cli/benchmark.rs), and — used only in #[cfg(test)]
# — benchmark/model_bench.sh and tests/fixtures/transcript_basic.jsonl (so
# `cargo test` works on the published crate).
include = ["/src/**/*", "/build.rs", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/benchmark/quality_corpus/*.json", "/benchmark/model_bench.sh", "/tests/fixtures/transcript_basic.jsonl"]

# Fast path for `cargo binstall trimwire` — fetch the prebuilt release asset
# instead of compiling from source. Matches the asset names release.yml emits.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/trimwire-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"   # resolves to `trimwire` (Unix) / `trimwire.exe` (Windows)
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/trimwire-{ target }.zip"
pkg-fmt = "zip"

[features]
default = []

[lib]
name = "trimwire"
path = "src/lib.rs"

[[bin]]
name = "trimwire"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
http-body = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", features = ["webpki-roots", "http2"] }
rustls = "0.23"
webpki-roots = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ahash = "0.8"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"   # OS CSPRNG for the telemetry install-id (BCryptGenRandom on Windows)
# MSRV-1.85 hold: rusqlite 0.40.x pulls libsqlite3-sys 0.38.x, whose build.rs
# uses the std `cfg_select!` macro (stabilized well after 1.85) and fails on the
# declared MSRV. 0.39.x keeps libsqlite3-sys at 0.37 (cfg_select-free). Bump once
# the project's MSRV is raised. See deps/refresh-all PR notes.
rusqlite = { version = "0.39", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
listenfd = "1"
dashmap = "6"
minisign-verify = "0.2.5"

# Used only for the launchd socket-activation FFI (launch_activate_socket).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Lints live here (not just CI flags) so a local `cargo build`/`clippy`/IDE sees
# the same strictness CI enforces. unsafe is denied crate-wide; the macOS
# socket-activation + getuid FFI opt back in explicitly at their call sites.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
# Future-proofing: never ship debugging/placeholder artifacts (zero violations today).
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
# `test` feature adds figment::Jail (sandboxed cwd+env) for Config::load tests.
figment = { version = "0.10", features = ["toml", "env", "test"] }
insta = { version = "1.48", features = ["json"] }
rstest = "0.26"
# MSRV-1.85 hold: wiremock 0.6.5 uses let-chains (`if let … && let …`),
# stabilized in Rust 1.88, so it fails to compile on the declared MSRV. Pinned to
# 0.6.4 (last pre-let-chains release). Bump once the project's MSRV is raised.
wiremock = "=0.6.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
tempfile = "3"
pretty_assertions = "1"
# Generate real release-signing fixtures for the `trimwire update` verification
# tests: `minisign` signs (the prehashed `-H` form), and the runtime dep
# `minisign-verify` verifies. sha2/hex compute the published `.sha256` the fake
# release server serves (normal deps aren't in scope for the integration-test
# crate, so they're re-declared here).
# minisign 0.9.1 (dev-only; signs the update-verification fixtures). No declared
# MSRV; confirmed 1.85-compatible (resolver + MSRV CI). Pulls scrypt/rpassword/
# ct-codecs as transitive dev-deps; none ship in the release binary.
minisign = "0.9.1"
sha2 = "0.11"
hex = "0.4"
# Base64 (already in the lock via `minisign`) — used by one unit test to craft a
# legacy (non-prehashed) minisig from a real fixture and assert it's rejected.
ct-codecs = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
# Line tables only: keep file+line numbers in panic/backtrace output (the only
# debug info CI and `RUST_BACKTRACE` actually use) but skip the full DWARF
# variable/type info. Cheaper to emit and link; nothing here is run under a
# step debugger. Use `debug = true` locally if you need variable inspection.
debug = "line-tables-only"

# Tests do real CPU work (the benchmark replays + the 3,000-body fuzz), so build
# them optimized — the dependency graph is unaffected, only the test/bench code
# is compiled hotter, which cuts the suite's wall time noticeably.
[profile.test]
opt-level = 2
# Same line-tables-only trade-off as [profile.dev] (test inherits dev, but set
# it explicitly so the intent survives a future dev-profile change).
debug = "line-tables-only"
