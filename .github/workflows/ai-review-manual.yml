# Manual, on-demand review — from the Actions UI, enter a PR number and run.
# Because workflow_dispatch requires write access, the trigger is inherently trusted
# (only maintainers can run it), so — unlike the auto flow — this is a single job that
# gathers + reviews + posts.
#
# `engine` picks WHICH reviewer runs:
#   personas    (default) = the routed-persona system (SURVEYOR + the bench-tuned prompt config),
#                the same engine as the auto flow. The model_* / aggregator inputs are IGNORED
#                (personas use fixed per-lane models). Use this for a normal review.
#   legacy-panel = the older N-generalist panel + LLM aggregator, driven by the model_* inputs
#                below — handy when you want to throw specific heavy models (Opus 4.8, GPT-5.5, …)
#                at a big/high-stakes diff.
name: AI Review - Manual

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review (e.g. 141)"
        required: true
      engine:
        description: "Review engine (personas = routed-persona system; legacy-panel = generalist panel below)"
        type: choice
        default: "personas"
        options:
          - personas
          - legacy-panel
      # The four model inputs below apply ONLY to engine=legacy-panel (ignored for personas).
      # Type full OpenRouter ids (provider/model) — one key reaches everything. Leave a slot
      # blank to use fewer models. A bad id fails the run in ~1s (see "Validate model ids").
      model_1:
        description: "[legacy-panel] Panel model 1 — full OpenRouter id, e.g. anthropic/claude-opus-4.8"
        default: "deepseek/deepseek-v3.2"
      model_2:
        description: "[legacy-panel] Panel model 2 — OpenRouter id, e.g. openai/gpt-5.5 (blank to skip)"
        default: "openai/gpt-5-mini"
      model_3:
        description: "[legacy-panel] Panel model 3 — OpenRouter id (blank to skip)"
        default: "google/gemini-3.5-flash"
      aggregator:
        description: "[legacy-panel] Aggregator — full OpenRouter id, e.g. google/gemini-3.5-flash"
        default: "google/gemini-3.5-flash"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-manual-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout base repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Validate model ids (fail fast on a typo)
        if: ${{ inputs.engine == 'legacy-panel' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          M1: ${{ inputs.model_1 }}
          M2: ${{ inputs.model_2 }}
          M3: ${{ inputs.model_3 }}
          AGG: ${{ inputs.aggregator }}
        run: |
          set -euo pipefail
          # Free catalog check (no inference spend) — a bad id fails the job in ~1s
          # with a clear annotation, instead of silently dropping the model.
          ids=$(curl -sf https://openrouter.ai/api/v1/models \
                 -H "Authorization: Bearer $OPENROUTER_API_KEY" | jq -r '.data[].id')
          [ -n "$ids" ] || { echo "::error::could not fetch OpenRouter catalog"; exit 1; }
          fail=0
          for m in "$M1" "$M2" "$M3" "$AGG"; do
            [ -z "$m" ] && continue
            if ! printf '%s\n' "$ids" | grep -qxF -- "$m"; then
              echo "::error::unknown OpenRouter model id: '$m'"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "Fix the model id(s) above and re-run."; exit 1; }
          echo "all model ids valid"

      - name: Fetch PR diff + metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          # Reject anything but a positive integer before it reaches gh api (a
          # crafted value like `141"` could otherwise pass a flag to gh).
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::PR must be a positive integer"; exit 1; }
          mkdir -p artifacts
          gh api "repos/$REPO/pulls/$PR/files" --paginate > artifacts/pr-files.json
          gh api "repos/$REPO/pulls/$PR" > pr.json
          jq -n \
            --arg number "$PR" \
            --arg title  "$(jq -r '.title' pr.json)" \
            --arg author "$(jq -r '.user.login' pr.json)" \
            --arg base   "$(jq -r '.base.sha' pr.json)" \
            --arg head   "$(jq -r '.head.sha' pr.json)" \
            --arg repo   "$REPO" \
            --rawfile body <(jq -r '.body // ""' pr.json) \
            '{number: ($number|tonumber), title: $title, author: $author,
              base_sha: $base, head_sha: $head, repo: $repo, body: $body}' \
            > artifacts/pr-meta.json

      # Only in legacy-panel mode: exporting AI_REVIEW_PANEL/AGGREGATOR is what makes
      # ai_review.py take the legacy generalist path (_use_legacy_panel). In personas mode
      # we deliberately DON'T set them, so the routed-persona engine runs instead.
      - name: Build panel from inputs
        if: ${{ inputs.engine == 'legacy-panel' }}
        env:
          M1: ${{ inputs.model_1 }}
          M2: ${{ inputs.model_2 }}
          M3: ${{ inputs.model_3 }}
          AGG: ${{ inputs.aggregator }}
        run: |
          set -euo pipefail
          # Non-empty model slots become the panel (all provider=openrouter). jq
          # builds the JSON safely — inputs are never interpolated into a shell command.
          panel=$(jq -cn --arg m1 "$M1" --arg m2 "$M2" --arg m3 "$M3" '
            [$m1, $m2, $m3] | map(select(. != ""))
            | map({name: ., provider: "openrouter", model: .})')
          agg=$(jq -cn --arg a "$AGG" '{name: $a, provider: "openrouter", model: $a}')
          # Write via heredoc delimiters (GitHub's recommended form) so a value can
          # never inject extra env vars — defense-in-depth even though jq -c emits a
          # single line and the ids are already catalog-validated above.
          {
            printf 'AI_REVIEW_PANEL<<__TW_EOF__\n%s\n__TW_EOF__\n' "$panel"
            printf 'AI_REVIEW_AGGREGATOR<<__TW_EOF__\n%s\n__TW_EOF__\n' "$agg"
          } >> "$GITHUB_ENV"

      - name: Capture existing CI results (best effort — no re-run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ground the review in CI truth the same way the auto flow does, so a high-stakes
          # manual review defers to clippy/tests/audit instead of re-flagging them.
          HEAD=$(jq -r '.head_sha // ""' artifacts/pr-meta.json)
          [ -n "$HEAD" ] || exit 0
          gh api "repos/$REPO/commits/$HEAD/check-runs" --paginate \
            -q '.check_runs[] | "\(.name): \(.conclusion // .status)"' \
            2>/dev/null | sort -u > artifacts/ci-signals.txt || true
          gh api "repos/$REPO/commits/$HEAD/check-runs" --paginate \
            -q '.check_runs[] | select(.conclusion == "failure" or ((.output.annotations_count // 0) > 0)) | .id' \
            2>/dev/null | head -8 | \
          while read -r id; do
            gh api "repos/$REPO/check-runs/$id/annotations" --paginate \
              -q '.[] | "\(.path):\(.start_line): \(.annotation_level): \(.message)"' 2>/dev/null || true
          done | head -c 6000 > artifacts/ci-failure-logs.txt || true

      - name: Run review
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTIFACTS_DIR: artifacts
        run: python3 scripts/ai_review.py

      # Compile-verify the reviewer's single-line ```suggestion fixes. Manual flow only:
      # workflow_dispatch is maintainer-gated, so checking out + building PR-head code is
      # trusted (same threat model as ci.yml, which already compiles it). Best-effort: any
      # failure here never blocks the review post. PR head goes in an ISOLATED worktree so
      # the trusted base checkout's scripts are never overwritten by PR-head code.
      - name: Compile-verify AI suggestions (best effort)
        continue-on-error: true
        env:
          PR: ${{ inputs.pr }}
        run: |
          set -uo pipefail
          [ -f findings.json ] || { echo "no findings.json; skip verify"; exit 0; }
          HEAD=$(jq -r '.head_sha // ""' artifacts/pr-meta.json)
          [ -n "$HEAD" ] || exit 0
          git fetch --depth 1 origin "$HEAD" 2>/dev/null \
            || git fetch --depth 1 origin "pull/$PR/head" 2>/dev/null || exit 0
          git worktree add --detach pr-head FETCH_HEAD || exit 0
          # base checkout's (trusted) verifier applies replacements to the pr-head tree
          summary=$(python3 scripts/ai_review_verify.py findings.json pr-head) || exit 0
          echo "verify: $summary"
          applied=$(printf '%s' "$summary" | jq '.applied | length')
          [ "$applied" -gt 0 ] || { echo "no single-line suggestions to verify"; exit 0; }
          if [ "$(printf '%s' "$summary" | jq -r '.touched_rust')" = "true" ]; then
            if (cd pr-head && cargo check --quiet 2>/tmp/cargo_err); then
              note="✅ **Suggestion compile-check:** all $applied applied single-line fix(es) compile (\`cargo check\` on PR head + suggestions)."
            else
              # 4-space-indented code block: renders compiler output verbatim, no ```fence to break out of
              errs=$(head -c 1200 /tmp/cargo_err | sed 's/^/    /')
              note=$(printf '⚠️ **Suggestion compile-check:** applying %s single-line fix(es) does NOT compile:\n\n%s' "$applied" "$errs")
            fi
          else
            note="ℹ️ **Suggestion compile-check:** $applied single-line fix(es) applied to non-Rust files (no cargo check run)."
          fi
          printf '\n\n---\n%s\n' "$note" >> review.md
          git worktree remove --force pr-head 2>/dev/null || true

      - name: Post sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ai-code-review -->';
            const meta = JSON.parse(fs.readFileSync('artifacts/pr-meta.json', 'utf8'));
            const prNumber = Number(meta.number);
            const body = fs.readFileSync('review.md', 'utf8');
            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber }
            );
            // Only update our own bot comment (anti-hijack).
            const existing = comments.find(
              c => c.body && c.body.includes(MARKER) && c.user && c.user.type === 'Bot'
            );
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: prNumber, body });
            }
