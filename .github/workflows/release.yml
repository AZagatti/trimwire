name: Release

# Build cross-platform binaries and attach them to the GitHub Release. Asset
# names are `trimwire-<triple>.tar.gz` (`.zip` on Windows) — exactly what
# `scripts/install.sh` downloads.
#
# Triggers on a published GitHub release (how release-plz hands off — see
# release-plz.yml). Single trigger by design: release-plz both tags and publishes
# the release, so listening on `push: tags` too would fire a second, racing build
# that collides on asset upload. For a manual release use `gh release create
# vX.Y.Z` (which fires this). NOTE: the release must be created with a PAT
# (release-plz's RELEASE_PLZ_TOKEN) — a release made with the default GITHUB_TOKEN
# does not trigger this workflow, so no binaries would be attached.
#
# Hand-rolled matrix rather than cargo-dist: no extra tooling/version to pin,
# fully transparent, and it emits the precise asset names the installer expects.

on:
  release:
    types: [published]
  # Manual fallback: (re)build + attach binaries for an existing tag/release.
  # Use when a release was created with GITHUB_TOKEN (no PAT), which doesn't fire
  # the `release: published` trigger — e.g. release-plz without RELEASE_PLZ_TOKEN.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + attach binaries for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

# Serialize per tag: if a manual `workflow_dispatch` is fired while the automatic
# `release: published` run for the same tag is in flight, the two would race on
# uploading identical assets (one fails on a GitHub API conflict). Never cancel an
# in-flight release — let the first finish.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Refuse to release if the tag != the crate version
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $ver — bump the version or fix the tag"
            exit 1
          fi

  build:
    needs: guard
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin # cross-compiled on the arm64 runner
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package + checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          asset="trimwire-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" trimwire
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Package + checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $asset = "trimwire-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/trimwire.exe" `
            -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true
