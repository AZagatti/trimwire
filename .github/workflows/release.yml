name: Release

# Build cross-platform binaries and attach them to the GitHub Release. Asset
# names are `trimwire-<triple>.tar.gz` (`.zip` on Windows) — exactly what
# `scripts/install.sh` downloads.
#
# Triggers on a published GitHub release (how release-plz hands off — see
# release-plz.yml). Single trigger by design: release-plz both tags and publishes
# the release, so listening on `push: tags` too would fire a second, racing build
# that collides on asset upload. For a manual release use `gh release create
# vX.Y.Z` (which fires this). NOTE: the release must be created with a PAT
# (release-plz's RELEASE_PLZ_TOKEN) — a release made with the default GITHUB_TOKEN
# does not trigger this workflow, so no binaries would be attached.
#
# Hand-rolled matrix rather than cargo-dist: no extra tooling/version to pin,
# fully transparent, and it emits the precise asset names the installer expects.

on:
  release:
    types: [published]
  # Manual fallback: (re)build + attach binaries for an existing tag/release.
  # Use when a release was created with GITHUB_TOKEN (no PAT), which doesn't fire
  # the `release: published` trigger — e.g. release-plz without RELEASE_PLZ_TOKEN.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + attach binaries for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read # least privilege by default; jobs widen as needed

# Serialize per tag: if a manual `workflow_dispatch` is fired while the automatic
# `release: published` run for the same tag is in flight, the two would race on
# uploading identical assets (one fails on a GitHub API conflict). Never cancel an
# in-flight release — let the first finish.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag matches Cargo.toml version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Refuse to release if the tag != the crate version
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $ver — bump the version or fix the tag"
            exit 1
          fi

  build:
    needs: guard
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # upload the release assets
      id-token: write # OIDC: sign the build provenance (actions/attest-build-provenance)
      attestations: write # write the attestation to the repo's attestation store
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin # cross-compiled on the arm64 runner
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package + checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          asset="trimwire-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" trimwire
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Package + checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $asset = "trimwire-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/trimwire.exe" `
            -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Cryptographic build provenance for the EXACT archive bytes we upload (the
      # subject is the asset + its digest). Verifiable later with `gh attestation
      # verify <asset> --repo AZagatti/trimwire --signer-workflow
      # AZagatti/trimwire/.github/workflows/release.yml`. This adds provenance
      # (proves WHO/WHAT built it) on top of — not instead of — the same-origin
      # `.sha256` (which only proves transit integrity). Attest the archive before
      # upload so the attested digest matches what users download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true

  # Sign every release archive with minisign (Ed25519), producing a detached
  # `<asset>.minisig` that `trimwire upgrade --dry-run` / `trimwire upgrade`
  # verify against a public key PINNED in the binary (and in `trimwire.pub`).
  # This is PROVENANCE on top of the same-origin `.sha256` (transit integrity)
  # and the GitHub attestation: an attacker who replaces a release asset + its
  # checksum still can't forge a minisign signature without the owner's offline
  # secret key.
  #
  # FAIL-CLOSED: signing is MANDATORY. If `MINISIGN_SECRET_KEY` is absent the job
  # FAILS (the release run goes red) rather than publishing unsigned archives —
  # so a "successful" run always means the archives are signed. The `verify` job
  # then re-verifies a `.minisig` against the pinned public key before the run is
  # green. Key generation / rotation is a maintainer task; the signing key +
  # secrets (`MINISIGN_SECRET_KEY` / `MINISIGN_PASSWORD`) are already configured.
  #
  # RESIDUAL (by design — build-first, sign-second): `build` attaches the archives
  # + `.sha256` to the release BEFORE `sign` runs. So a FAILED `sign`/`verify` run
  # (red) leaves unsigned archives attached. `trimwire upgrade` refuses them
  # (no/!verified `.minisig` ⇒ fail-closed), and they still carry `.sha256` + a
  # GitHub attestation for manual `gh attestation verify`. Remediation: a red
  # release run means DO NOT ANNOUNCE — re-run the workflow (or delete + re-cut
  # the release) until the run is green.
  sign:
    needs: build
    name: sign release artifacts (minisign)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # download + upload release assets
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download release archives
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'trimwire-*.tar.gz' --pattern 'trimwire-*.zip'

      - name: Sign each archive (prehashed Ed25519)
        # Secrets are scoped to THIS step only (not the job) — the install/download
        # steps above never see them.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Both secrets are REQUIRED: the signing key is password-protected, so
          # MINISIGN_PASSWORD is needed to decrypt it. Fail fast (and fail-closed)
          # if either is missing rather than publishing an unsigned release.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set — refusing to publish an unsigned signed-update release. Configure the signing secret and re-run." >&2
            exit 1
          fi
          if [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::MINISIGN_PASSWORD is not set — the signing key is password-protected and can't be used without it. Configure the secret and re-run." >&2
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          cd dist
          shopt -s nullglob
          signed=0
          for f in trimwire-*.tar.gz trimwire-*.zip; do
            # -H = prehashed (the client requires it; legacy signatures are rejected).
            # The password-protected key is decrypted by piping MINISIGN_PASSWORD on
            # stdin (GitHub-hosted runners have no tty, so minisign reads it there);
            # the trailing newline terminates the password line.
            printf '%s\n' "$MINISIGN_PASSWORD" | \
              minisign -S -H -s "$key" -m "$f" -x "$f.minisig" \
                -c "trimwire $TAG release archive" -t "trimwire $TAG $f"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::no release archives found to sign for $TAG" >&2
            exit 1
          fi
          echo "signed $signed archive(s)"

      - name: Upload signatures
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.minisig
          fail_on_unmatched_files: true

  verify:
    needs: [build, sign] # gate the release on signing succeeding too
    name: verify published asset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # download the published asset
      attestations: read # `gh attestation verify` reads the attestation store
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Need the repo's committed public key (`trimwire.pub`) to verify the
      # `.minisig` independently of the binary.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Download + smoke-test the published linux asset
        run: |
          set -euo pipefail
          asset="trimwire-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern "$asset.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          ver="$(./trimwire --version)"
          echo "published binary reports: $ver"
          case "$ver" in
            *"${TAG#v}"*) echo "version matches tag $TAG" ;;
            *) echo "::error::published binary version '$ver' does not contain tag ${TAG#v}" >&2; exit 1 ;;
          esac

      # Prove the build provenance is actually published + verifiable for the
      # exact published archive — the public/CI provenance bar any user with `gh`
      # can run. (The client `trimwire upgrade` verifies the minisign signature
      # instead — see the next step.) Independent of the `.sha256` step above.
      - name: Verify artifact attestation (provenance)
        run: |
          set -euo pipefail
          asset="trimwire-x86_64-unknown-linux-gnu.tar.gz"
          # Present from the previous step; re-download if this job is re-run alone.
          [ -f "$asset" ] || gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          # Pin the signer to THIS repo's release.yml (not just --repo, which would
          # accept any workflow in the repo) so the check actually proves "built by
          # the release workflow", and reject any self-hosted-runner signer (the
          # build matrix is GitHub-hosted only). --signer-workflow is path-based, so
          # it's stable across tags.
          gh attestation verify "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --deny-self-hosted-runners
          echo "provenance attestation verified for $asset"

      # Re-verify the minisign signature against the PINNED public key (the exact
      # check `trimwire upgrade` runs client-side). This gates the release on a
      # valid, key-matching signature — so the run cannot go green if `sign`
      # produced no/bad signatures, and it catches a PINNED_PUBKEY ↔ signing-key
      # mismatch on the very first signed release.
      - name: Verify minisign signature against the pinned public key
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          asset="trimwire-x86_64-unknown-linux-gnu.tar.gz"
          [ -f "$asset" ] || gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset.minisig"
          # The pinned public key is the base64 payload line of the committed
          # trimwire.pub (same value as PINNED_PUBKEY in src/update.rs).
          pubkey="$(tail -n1 trimwire.pub)"
          minisign -Vm "$asset" -P "$pubkey"
          echo "minisign signature verified against the pinned public key for $asset"
