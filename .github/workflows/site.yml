name: Site

# Runs only when a PR touches the docs site. The "trophy": static type-check →
# unit/integration tests (vitest + happy-dom) → build → E2E (Playwright) →
# Lighthouse audit (perf / a11y / best-practices / seo).
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  test:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type-check (astro check)
        run: npm run check
      - name: Unit + integration tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          # No collector URLs: widgets fall back to embedded EXAMPLE data.
          PUBLIC_AGGREGATES_URL: ""
          PUBLIC_BENCHMARK_URL: ""
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Omit the collector URLs on purpose: the widgets fall back to their
          # embedded EXAMPLE data, so every page renders fully without a live feed.
          PUBLIC_AGGREGATES_URL: ""
          PUBLIC_BENCHMARK_URL: ""
      - name: Audit with Lighthouse CI
        # treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12 valid inputs: urls, configPath, budgetPath,
        # uploadArtifacts, temporaryPublicStorage, runs, serverBaseUrl, serverToken.
        # startServerCommand / startServerReadyPattern / assertionConfig are NOT
        # supported inputs — assertions and server config belong in lighthouserc.json
        # (see site/lighthouserc.json). staticDistDir in the rc file means LHCI spins
        # up its own static server, so no separate serve step is needed.
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: "./site/lighthouserc.json"
          uploadArtifacts: true
