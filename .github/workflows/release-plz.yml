name: Release-plz

# Automates versioning, CHANGELOG, tagging, the GitHub release, and the
# crates.io publish from conventional commits.
#
# Two jobs:
#   - release-plz-pr     : opens/updates a "release PR" that bumps Cargo.toml +
#                          regenerates CHANGELOG.md. Merge it to cut a release.
#   - release-plz-release: on push to main (i.e. once the release PR merges),
#                          tags, publishes to crates.io, and creates the GitHub
#                          release.
#
# The cross-platform BINARIES are built by release.yml, which triggers on the
# `release: published` event this job emits. NOTE: for that downstream trigger to
# fire automatically, release-plz must run with a PAT (secrets.RELEASE_PLZ_TOKEN)
# — a release created with the default GITHUB_TOKEN does NOT trigger other
# workflows.
#
# Required secrets: CARGO_REGISTRY_TOKEN (crates.io publish); optional
# RELEASE_PLZ_TOKEN (PAT, contents+PR write) for downstream binary builds. Also
# enable Settings → Actions → "Allow GitHub Actions to create and approve PRs".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Fail fast BEFORE checkout/toolchain so a missing PAT can't waste setup time.
      - name: Require RELEASE_PLZ_TOKEN
        env:
          PAT: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::RELEASE_PLZ_TOKEN (PAT) is not set. A release created with the default GITHUB_TOKEN does not trigger release.yml, so no binaries would attach. Refusing to publish a binary-less release." >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
        env:
          # Opening a release PR with GITHUB_TOKEN is harmless; only the publish step (release-plz-release) needs the PAT.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
