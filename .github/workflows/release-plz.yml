name: Release-plz

# Automates versioning, CHANGELOG, tagging, the GitHub release, and the
# crates.io publish from conventional commits.
#
# Two jobs:
#   - release-plz-pr     : opens/updates a "release PR" that bumps Cargo.toml +
#                          regenerates CHANGELOG.md. Merge it to cut a release.
#   - release-plz-release: on push to main (i.e. once the release PR merges),
#                          tags, publishes to crates.io, and creates the GitHub
#                          release.
#
# The cross-platform BINARIES are built by release.yml, which triggers on the
# `release: published` event this job emits. NOTE: for that downstream trigger to
# fire automatically, release-plz must run with a PAT (secrets.RELEASE_PLZ_TOKEN)
# — a release created with the default GITHUB_TOKEN does NOT trigger other
# workflows.
#
# Required secrets: CARGO_REGISTRY_TOKEN (crates.io publish); optional
# RELEASE_PLZ_TOKEN (PAT, contents+PR write) for downstream binary builds. Also
# enable Settings → Actions → "Allow GitHub Actions to create and approve PRs".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
