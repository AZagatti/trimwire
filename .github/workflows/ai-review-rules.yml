# Human-gated maintenance of the reviewer's memory (.review-rules/).
# The reviewer PROPOSES rules (shown in its PR comment); a maintainer runs this to
# codify one — it appends the rule and opens a PR. Rules are never auto-committed to
# the default branch (rule text goes into the model prompt, so a merge gate blocks
# rule-injection). workflow_dispatch requires write access, so the trigger is trusted.
#
# TODO(before merge): pin actions by SHA (repo policy).
name: AI Review - Rules

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Which rule file to add to"
        type: choice
        options: [base, rust, typescript, python, ci]
        default: rust
      rule:
        description: "The rule (one line, e.g. 'never unwrap() in gateway.rs')"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  add-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Append rule + open PR
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ inputs.category }}
          RULE: ${{ inputs.rule }}
        run: |
          set -euo pipefail
          FILE=".review-rules/${CATEGORY}.md"
          [ -f "$FILE" ] || { echo "::error::no such rule file: $FILE"; exit 1; }
          # Append via printf (never eval'd) — inputs come from the maintainer.
          printf -- '- %s\n' "$RULE" >> "$FILE"
          BRANCH="ai-review-rules/${CATEGORY}-$(date -u +%Y%m%d%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "docs(review-rules): add ${CATEGORY} rule"
          git push -u origin "$BRANCH"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "review-rules: add ${CATEGORY} rule" \
            --body "Codifies a reviewer-proposed convention into \`${FILE}\`. Review the wording before merging — rule text is injected into the review prompt."
