name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Harden against flaky crates.io downloads on GitHub runners: retry, and disable
  # HTTP/2 multiplexing (root cause of intermittent "[16] HTTP2 framing layer" curl
  # errors during cargo package/fetch).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  check:
    name: fmt + clippy + test
    # EXPERIMENT: ARM64 runners are free for public repos and benchmark faster
    # per-core than the x86 ubuntu-latest. Only the critical path moves here; the
    # job name (a required status check) is unchanged. Revert if the warm-cache
    # wall-clock isn't a clear, repeatable win.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # nextest runs each test in its own process — stronger isolation for the
      # async/gateway/port-binding integration tests than the default shared-
      # process runner. It does NOT run doctests, so they get a dedicated step
      # below (today there are 0 Rust doctests; this guards against a future one
      # being silently skipped).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: nextest
      - name: cargo nextest run
        run: cargo nextest run --no-fail-fast
      - name: cargo test --doc (nextest doesn't run doctests)
        run: cargo test --doc

      # Build the release bin AND the two examples CI runs (longitudinal_harm +
      # bench) in ONE compile, so the later `cargo run --release --example …`
      # steps (here + bench-drift-check.sh) just execute instead of recompiling
      # the crate two more times. (Only these two examples — not `--examples`,
      # which would also build the ~10 dev-only examples.)
      - name: cargo build (release; bin + CI examples in one compile)
        run: cargo build --release --bins --example longitudinal_harm --example bench

      - name: longitudinal degradation harness (offline, deterministic)
        run: cargo run --release --example longitudinal_harm

      - name: cargo doc (deny warnings — guards docs.rs + intra-doc links)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo package (verify the crates.io `include` list builds)
        run: cargo package --locked

      # Prebuilt actionlint via the same SHA-pinned installer used for the other tools,
      # instead of curl|bash from a mutable upstream tag (supply-chain hardening).
      - uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: actionlint
      - name: actionlint (workflow lint)
        run: actionlint

      - name: shellcheck installer scripts
        run: |
          sh -n scripts/install.sh
          bash -n scripts/install-smoke.sh
          bash -n scripts/bench-drift-check.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/install.sh scripts/install-smoke.sh scripts/bench-drift-check.sh

      - name: install.sh end-to-end smoke (local artifact, no network)
        run: TRIMWIRE_SMOKE_BIN="$PWD/target/release/trimwire" bash scripts/install-smoke.sh

      - name: dogfood harness (synthetic fixtures, offline, no live model)
        run: python3 scripts/dogfood.py --bin "$PWD/target/release/trimwire"

      - name: benchmark results drift guard (RESULTS.md vs deterministic bench)
        run: bash scripts/bench-drift-check.sh

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Actually build on the advertised minimum so the rust-version claim
      # (and edition 2024's floor) can't silently drift on a dep bump.
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # 1.85.0
      # No rust-cache here: the MSRV build must be COLD so a dep that quietly raised its real MSRV can't pass on a stale cached build-script artifact (audit P1-3).
      - run: cargo build --locked
      # Compile + run the tests on the floor too: a dep or test-only construct
      # that needs a newer rustc must fail here, not at a user's `cargo test`.
      # (Measured: nextest here was a net LOSS — extra install + a separate
      # doctest compile outweigh the parallel run, since the cost is the compile.)
      - run: cargo test --locked --no-fail-fast

  audit:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
      # cargo-audit via a PREBUILT binary (taiki-e/install-action) instead of the
      # rustsec/audit-check action, which `cargo install`s cargo-audit FROM SOURCE
      # on every run (~3m of compile). Prebuilt + a host toolchain runs the same
      # advisory scan in seconds. `cargo audit` exits non-zero on a vulnerability.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-audit
      - run: cargo audit

  parity:
    name: Python parity oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
      # Run the Python invariant suite, then regenerate the reference fixtures
      # and fail if the committed copies drifted. The Rust parity tests diff
      # against these files, so this is what stops the reference and the port
      # from silently diverging.
      - name: phase0 pytest invariants
        run: make phase0
      - name: parity fixtures are current
        run: make phase0-verify

  ai-review-checks:
    name: AI-review lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
      # Deterministic gate for the review engine's own Python (the completeness layer:
      # the LLM reviewer is advisory, these checks are non-negotiable).
      - name: ruff (AI-review scripts)
        run: uvx ruff check scripts/ai_review.py scripts/ai_review_personas.py scripts/test_ai_review.py
      - name: AI-review unit tests (stdlib)
        run: python3 scripts/test_ai_review.py

  semver:
    name: SemVer (public API vs base)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0   # need history so --baseline-rev can build the base
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-semver-checks
      # PR-vs-base (not crates.io): flag only breaking public-API changes THIS PR introduces.
      # The deterministic completeness layer for the FERRUS semver gap the LLM can't reliably catch.
      - name: cargo semver-checks (vs base)
        run: cargo semver-checks --baseline-rev "${{ github.event.pull_request.base.sha }}"

  cross-platform:
    name: cross-platform build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Lint the per-OS cfg paths (macOS launchd FFI, windows cmd) that the
      # ubuntu-only `check` job never compiles.
      - run: cargo clippy --all-targets -- -D warnings

      # Actually RUN the suite on macOS + Windows, not just clippy/build/smoke —
      # otherwise a test that only fails on a non-Linux target ships undetected.
      # nextest (the same runner as `check`) gives process-per-test isolation,
      # which matters most here: the gateway/port-binding integration tests are
      # exactly the ones prone to cross-platform flakiness. `tests/cli.rs` is
      # `#![cfg(unix)]` (shell-shim e2e), so on Windows this runs the
      # platform-independent suite + unit tests; macOS runs everything.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: nextest
      - name: cargo nextest run
        run: cargo nextest run --no-fail-fast

      - run: cargo build --release
      - name: Binary size (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          SIZE=$(stat -c%s target/release/trimwire 2>/dev/null || stat -f%z target/release/trimwire)
          MAX=$((12 * 1024 * 1024))
          echo "binary size: ${SIZE} bytes (limit: ${MAX})"
          [ "$SIZE" -le "$MAX" ]

      - name: Daemon smoke (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          TRIMWIRE_LEDGER__ENABLED=false target/release/trimwire daemon --listen 127.0.0.1:8765 &
          PID=$!
          ok=0
          for _ in $(seq 1 25); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1',8765),timeout=1)" 2>/dev/null; then ok=1; break; fi
            sleep 0.2
          done
          kill "$PID" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "FAIL: daemon did not listen"; exit 1; }
          echo "daemon smoke OK"

      - name: Binary size (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $size = (Get-Item target/release/trimwire.exe).Length
          $max = 12 * 1024 * 1024
          Write-Output "binary size: $size bytes (limit: $max)"
          if ($size -gt $max) { Write-Error "binary too large"; exit 1 }

      - name: Daemon smoke (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:TRIMWIRE_LEDGER__ENABLED = "false"
          $p = Start-Process -FilePath "target/release/trimwire.exe" `
                 -ArgumentList "daemon","--listen","127.0.0.1:8765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 25; $i++) {
            try {
              $tc = New-Object Net.Sockets.TcpClient
              $tc.Connect("127.0.0.1", 8765); $tc.Close()
              $ok = $true; break
            } catch { Start-Sleep -Milliseconds 200 }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "FAIL: daemon did not listen"; exit 1 }
          Write-Output "daemon smoke OK"
