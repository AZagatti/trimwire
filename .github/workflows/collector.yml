name: Collector

# Runs only when a PR touches the telemetry collector. The collector validates
# anonymous, content-free benchmark/telemetry rows (closed enums, k-anonymity,
# fail-closed guards) — privacy-critical logic that must never silently drift, so
# its type-check + unit tests gate every change. Pure-logic tests only (no Workers
# runtime / Cloudflare account needed), so the job is fast.
on:
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: collector

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck
      - name: Unit tests (vitest — pure validation/aggregation logic)
        run: npm test
      - name: Route/integration tests (vitest-pool-workers — HTTP gate in workerd)
        run: npm run test:routes
