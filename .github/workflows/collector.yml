name: Collector

# Runs when a change touches the telemetry collector. The collector validates
# anonymous, content-free benchmark/telemetry rows (closed enums, k-anonymity,
# fail-closed guards) — privacy-critical logic that must never silently drift, so
# every change is gated by: type-check, the fast pure-logic unit tests (validate +
# aggregate, no Workers runtime needed), AND the route/integration tests that run
# the real Worker in workerd via vitest-pool-workers (HTTP boundary: ingest
# validation, k-anonymity enforcement, security headers). No Cloudflare account
# needed — workerd is fetched by `npm ci`.
on:
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: collector

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck
      - name: Unit tests (vitest — pure validation/aggregation logic)
        run: npm test
      - name: Route/integration tests (vitest-pool-workers — HTTP gate in workerd)
        run: npm run test:routes
