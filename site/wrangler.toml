# trimwire docs site — Cloudflare Workers (static assets) config.
#
# The site is a static Astro build. On the unified Workers platform a static
# site deploys as a Worker that serves an assets directory (no server code), so
# there is no `main` entrypoint — just the built `dist/` folder.
#
# Deploy flow (Workers Builds, Git-connected):
#   Path (root directory) = site
#   Build command         = npm run build      (runs sync-docs then astro build)
#   Deploy command        = npx wrangler deploy
# `dist` below is relative to this file (i.e. site/dist).

# Must match the Workers Builds project name (the CI overrides a mismatch and
# would open a PR to reconcile it).
name = "trimwire"
# Bump to your deploy date before going live (a recent date opts into current
# Workers runtime semantics). Any past date is valid.
compatibility_date = "2026-06-12"

# Opt in to preview URLs. Production serves only the custom domain (workers.dev
# route is off), which would otherwise default preview URLs to disabled. With
# this on, Workers Builds publishes a per-commit and per-branch preview
# (`<prefix|branch>-trimwire.<subdomain>.workers.dev`) for non-production
# branches and the Cloudflare GitHub app posts the links on the PR. Production
# (`trimwire.dev`, main-only deploy) is unaffected.
preview_urls = true

[assets]
directory = "./dist"

# Custom domain, declared as code. Because trimwire.dev's DNS zone lives in the
# same Cloudflare account, deploying creates the DNS record and attaches the
# domain to this Worker automatically — no dashboard step, no manual records.
# (apex is fine; Workers custom domains support it.) Remove this block to fall
# back to the *.workers.dev URL.
[[routes]]
pattern = "trimwire.dev"
custom_domain = true
