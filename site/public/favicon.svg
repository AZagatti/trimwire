<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="trimwire">
  <!-- teal badge -->
  <rect width="32" height="32" rx="7" fill="#2aa39c"/>
  <!-- a "wire", trimmed: a long bold segment that's kept + a short remnant past a
       clear gap. Two bold strokes stay crisp and identifiable at favicon size. -->
  <path d="M6.5 16h9.5" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M20.5 16h5" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" opacity="0.74"/>
</svg>
