# trimwire telemetry collector — Cloudflare Worker config.
#
# This is the DEPLOYED config: it carries the real (account-scoped, non-secret)
# D1/KV ids and is live at api.trimwire.dev. The repo CI does NOT auto-deploy —
# the maintainer runs `wrangler deploy` by hand. Forks: swap in your own ids.

name = "trimwire-telemetry"
main = "src/index.ts"
# A recent date opts into current Workers runtime semantics. Any past date is valid.
compatibility_date = "2026-06-12"

# REQUIRED for the /aggregates.json edge cache to work: caches.default is a
# no-op on *.workers.dev, so without a custom domain every GET rescans D1.
# Deploy behind a route/custom domain (you want a stable telemetry URL anyway).
# Flip to true only for a throwaway workers.dev test (cache will be inactive).
workers_dev = false

# Custom domain, declared as code. Because api.trimwire.dev's DNS zone is in the
# same Cloudflare account, deploying creates the DNS record and binds the domain
# automatically — no dashboard step. This also enables the /aggregates.json edge
# cache and makes CF-Connecting-IP trustworthy for the rate-limiters (both are
# no-ops / spoofable on a bare *.workers.dev). The client POSTs to /ingest +
# /ingest-benchmark; the site reads /aggregates.json + /benchmarks.json.
[[routes]]
pattern = "api.trimwire.dev"
custom_domain = true

# Logs + metrics in the Cloudflare dashboard. 100% head sampling — this is a
# low-traffic collector, so full sampling is cheap and makes ingest/aggregate
# issues debuggable (the Worker uses structured console.error on bad rows).
[observability]
enabled = true
head_sampling_rate = 1

# k-anonymity threshold (the Worker floors this at 5). Raise as the user base
# grows; the dashboard stays intentionally sparse until buckets fill.
# MAX_PER_DAY caps accepted uploads per IP per UTC day.
[vars]
K = "10"
# Benchmark-leaderboard k-anonymity threshold (the Worker floors this at 3).
# Lower than K: benchmark rows carry only model family/size + score buckets
# (no IP, no per-session behavior), so they're far less identifying.
BENCH_K = "5"
MAX_PER_DAY = "50"
# Local dev / tests ONLY: set "true" to run /ingest without the rate-limiter.
# NEVER set this in production — it disables DoS / poisoning protection.
# ALLOW_UNTHROTTLED = "false"

# REQUIRED rate-limiter. The RUNTIME gate is authoritative: /ingest refuses to
# serve (HTTP 503) unless this KV namespace resolves at runtime (or
# ALLOW_UNTHROTTLED="true" for local dev). NOTE: `wrangler deploy` does NOT
# validate that the id below points at a real namespace — the placeholder is a
# reminder, not a deploy-time failure. You MUST create the namespace and paste
# its real id here, else every upload 503s:
#   wrangler kv namespace create RATE_LIMIT
# (add `preview_id` too if you use `wrangler dev --remote`.)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c21864118ca74267ab35e720a061e5f2"

# D1 binding. Create the DB and paste its id here before deploying:
#   wrangler d1 create trimwire-telemetry
#   wrangler d1 execute trimwire-telemetry --remote --file=./schema.sql  # apply to PROD
# (use --remote: without it the schema only lands on the LOCAL dev D1.)
[[d1_databases]]
binding = "DB"
database_name = "trimwire-telemetry"
database_id = "5e132ac0-8d1b-42cf-b463-0d40a82b1ea2"
